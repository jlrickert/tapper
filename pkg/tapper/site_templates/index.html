<h1>{{.SiteTitle}}</h1>
{{if .Summary}}<p>{{.Summary}}</p>{{end}}
<h2>Recent Nodes</h2>
<ul class="node-list">
  {{range .Nodes}}
  <li>
    <div class="node-title"><a href="{{$.BaseURL}}{{.ID}}/">{{.Title}}</a></div>
    <div class="node-meta">
      <span>Node {{.ID}}</span>
      {{if not .Updated.IsZero}}<span>{{.Updated.Format "2006-01-02"}}</span>{{end}}
    </div>
    {{if .Lead}}<div class="node-lead">{{.Lead}}</div>{{end}}
  </li>
  {{end}}
</ul>
