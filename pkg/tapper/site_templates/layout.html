<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - {{.SiteTitle}}</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a2e;
      --muted: #555;
      --border: #d0d7de;
      --link: #0969da;
      --link-visited: #6e40c9;
      --code-bg: #f0f3f6;
      --nav-bg: #f6f8fa;
      --tag-bg: #ddf4ff;
      --tag-fg: #0969da;
      --max-w: 68rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:visited { color: var(--link-visited); }
    nav {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
    }
    nav .inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    nav .site-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--fg);
      margin-right: auto;
    }
    nav a { font-size: 0.9rem; }
    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    h2 { font-size: 1.35rem; margin: 1.5rem 0 0.5rem; }
    h3 { font-size: 1.1rem; margin: 1.2rem 0 0.4rem; }
    p { margin: 0.6rem 0; }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 0.15em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      padding: 1rem;
      overflow-x: auto;
      border-radius: 6px;
      line-height: 1.45;
    }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; margin: 0.8rem 0; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    th { background: var(--nav-bg); }
    blockquote { margin: 0.8rem 0; padding: 0.4rem 1rem; border-left: 3px solid var(--border); color: var(--muted); }
    img { max-width: 100%; height: auto; }
    ul, ol { padding-left: 1.5rem; }
    li { margin: 0.2rem 0; }
    .meta { color: var(--muted); font-size: 0.88rem; margin-bottom: 1rem; }
    .meta span { margin-right: 1rem; }
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-fg);
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      font-size: 0.82rem;
      margin: 0.1rem 0.2rem;
    }
    .tag:hover { text-decoration: none; opacity: 0.85; }
    .node-list { list-style: none; padding: 0; }
    .node-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .node-list li:last-child { border-bottom: none; }
    .node-list .node-title { font-weight: 500; }
    .node-list .node-meta { font-size: 0.85rem; color: var(--muted); }
    .node-list .node-lead { font-size: 0.9rem; color: var(--muted); margin-top: 0.15rem; }
    /* Node two-column layout */
    .node-layout {
      display: grid;
      grid-template-columns: 1fr 16rem;
      gap: 2rem;
      align-items: start;
    }
    .node-content { min-width: 0; }
    .node-sidebar {
      position: sticky;
      top: 1rem;
      border-left: 1px solid var(--border);
      padding-left: 1.2rem;
      font-size: 0.9rem;
    }
    .node-sidebar h3 { font-size: 0.9rem; margin: 0 0 0.3rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .node-sidebar h3:not(:first-child) { margin-top: 1.2rem; }
    .node-sidebar ul { padding-left: 1.1rem; margin: 0; }
    .node-sidebar li { margin: 0.25rem 0; line-height: 1.4; }
    .node-sidebar .sidebar-close { display: none; }
    .sidebar-toggle { display: none; }
    .raw-links { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    .raw-links a { margin-right: 0.8rem; }

    /* Mobile: flyout panel */
    @media (max-width: 768px) {
      .node-layout {
        grid-template-columns: 1fr;
      }
      .sidebar-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        position: fixed;
        bottom: 1.2rem;
        right: 1.2rem;
        z-index: 100;
        background: var(--link);
        color: #fff;
        border: none;
        border-radius: 24px;
        padding: 0.6rem 1rem;
        font-size: 0.88rem;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      }
      .sidebar-toggle:hover { opacity: 0.9; }
      .node-sidebar {
        position: fixed;
        top: 0;
        right: -100%;
        width: 80%;
        max-width: 20rem;
        height: 100vh;
        background: var(--bg);
        border-left: 1px solid var(--border);
        padding: 1rem 1.2rem;
        overflow-y: auto;
        z-index: 200;
        transition: right 0.25s ease;
        box-shadow: -2px 0 12px rgba(0,0,0,0.1);
      }
      .node-sidebar.open { right: 0; }
      .node-sidebar .sidebar-close {
        display: block;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--muted);
        position: absolute;
        top: 0.6rem;
        right: 0.8rem;
        padding: 0.2rem 0.5rem;
        line-height: 1;
      }
      .node-sidebar .sidebar-close:hover { color: var(--fg); }
    }
    footer {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    {{if .HasSearch}}
    .pagefind-ui { margin-bottom: 1rem; }
    {{end}}
  </style>
  {{if .HasSearch}}
  <link href="{{.BaseURL}}pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="{{.BaseURL}}pagefind/pagefind-ui.js"></script>
  {{end}}
</head>
<body>
  <nav>
    <div class="inner">
      <a class="site-title" href="{{.BaseURL}}">{{.SiteTitle}}</a>
      <a href="{{.BaseURL}}">Home</a>
      <a href="{{.BaseURL}}tags/">Tags</a>
      <a href="{{.BaseURL}}changes/">Changes</a>
    </div>
  </nav>
  <main>
    {{if .HasSearch}}
    <div id="search"></div>
    {{end}}
    {{.Content}}
  </main>
  <footer>
    Generated by <a href="https://github.com/jlrickert/tapper">tapper</a>
  </footer>
  {{if .HasSearch}}
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      new PagefindUI({ element: "#search", showSubResults: true });
    });
  </script>
  {{end}}
</body>
</html>
