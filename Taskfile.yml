# https://taskfile.dev

version: "3"

includes:
  sandbox:
    taskfile: ./test-env/Taskfile.yml
    dir: ./test-env

tasks:
  run: go run "./cmd/keg" {{.CLI_ARGS}}
  test:
    cmds:
      - go test ./pkg/... {{.CLI_ARGS}}
    sources:
      - ./pkg/**/*.go
      - ./doc/**/*.md
    silent: true
  install-keg:
    desc: Install the keg CLI (go install ./cmd/keg).
    cmds:
      - go install ./cmd/keg
    sources:
      - cmd/**
      - pkg/**
      - docs/**/*.md
  install-tap:
    desc: Install the tap CLI (go install ./cmd/tap).
    cmds:
      - go install ./cmd/tap
    sources:
      - cmd/**/*.go
      - pkg/**/*.go
      - docs/**/*.md
  setup:
    desc: Wire repo-local git hooks (run once after clone).
    cmds:
      - git config core.hooksPath .githooks
  render-integrations:
    desc: Render canonical integrations/content into integrations/rendered/.
    cmds:
      - go run ./cmd/render-integrations
    sources:
      - integrations/content/**/*.md
      - pkg/integrations/**/*.go
      - cmd/render-integrations/**/*.go
    generates:
      - integrations/rendered/**
