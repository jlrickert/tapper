# https://taskfile.dev

version: "3"

includes:
  sandbox:
    taskfile: ./test-env/Taskfile.yml
    dir: ./test-env

tasks:
  run: go run "./cmd/tap" {{.CLI_ARGS}}
  test:
    cmds:
      - go test ./pkg/... {{.CLI_ARGS}}
    sources:
      - ./pkg/**/*.go
      - ./doc/**/*.md
    silent: true
  lint:docs:
    desc: Enforce documentation for exported interfaces under pkg/.
    cmds:
      - go test ./internal/apidoc
    sources:
      - ./internal/apidoc/**/*.go
      - ./pkg/**/*.go
    silent: true
  lint:fs:
    desc: Enforce that filesystem access goes through toolkit.Runtime.
    cmds:
      - go test ./internal/fsdiscipline
    sources:
      - ./internal/fsdiscipline/**/*.go
      - ./pkg/**/*.go
      - ./cmd/**/*.go
      - ./internal/**/*.go
    silent: true
  install-tap:
    desc: "Install the tap CLI to the host PATH (go install ./cmd/tap). Humans only: this replaces the tap every agent and integration on this machine resolves; test dev builds in a container (task sandbox:shell). See docs/development/commands.md."
    cmds:
      - go install ./cmd/tap
    sources:
      - cmd/**/*.go
      - pkg/**/*.go
      - docs/**/*.md
  setup:
    desc: Wire repo-local git hooks (run once after clone).
    cmds:
      - git config core.hooksPath .githooks
  render-integrations:
    desc: Render native Codex and Claude marketplaces into integrations/rendered/.
    cmds:
      - go run ./cmd/render-integrations
    sources:
      - integrations/content/**/*.md
      - pkg/integrations/renderdata/**
      - pkg/integrations/**/*.go
      - cmd/render-integrations/**/*.go
    generates:
      - integrations/rendered/**
