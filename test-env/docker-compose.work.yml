# Work-mode overlay for the tapper sandbox.
#
# Defines a parallel `sandbox-work` service that bind-mounts the local
# cli-toolkit working tree at /workspace/cli-toolkit alongside tapper at
# /workspace/tapper, and leaves GOWORK unset so the host's go.work
# (which references ../cli-toolkit) is honored. Builds and tests run
# inside the container then resolve cli-toolkit to the local working
# tree instead of the go.mod-pinned version.
#
# This is opt-in. The CI-mirror `sandbox` service in docker-compose.yml
# is untouched, and both services share the named volumes for Go module
# and build caches.
#
# Usage (raw compose):
#   docker compose -f docker-compose.yml -f docker-compose.work.yml up -d sandbox-work
#   docker compose -f docker-compose.yml -f docker-compose.work.yml exec sandbox-work zsh -l
#
# Or via Taskfile: `task sandbox:shell-work` (which wraps the above).
#
# Override CLI_TOOLKIT_PATH if cli-toolkit lives somewhere other than
# ../../cli-toolkit relative to this file.

services:
  sandbox-work:
    image: tapper-sandbox:local
    container_name: tapper-sandbox-work
    hostname: tapper-sandbox-work
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
    working_dir: /workspace/tapper
    command: ["sleep", "infinity"]
    environment:
      GOPATH: /home/jlrickert/go
      GOCACHE: /home/jlrickert/.cache/go-build
      # Empty (set, but no value) so entrypoint's `${GOWORK-off}` fallback
      # does not kick in and Go auto-detects /workspace/tapper/go.work.
      GOWORK: ""
    volumes:
      - ../:/workspace/tapper:cached
      - ${CLI_TOOLKIT_PATH:-../../cli-toolkit}:/workspace/cli-toolkit:cached
      - tapper-go-mod:/home/jlrickert/go
      - tapper-go-build:/home/jlrickert/.cache/go-build
      - tapper-state:/home/jlrickert/.local/state/tapper
