services:
  sandbox:
    build:
      context: .
      args:
        APP_UID: "1000"
        APP_GID: "1000"
    image: tapper-sandbox:local
    container_name: tapper-sandbox
    hostname: tapper-sandbox
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      GOPATH: /home/jlrickert/go
      GOCACHE: /home/jlrickert/.cache/go-build
      # Ignore go.work; use go.mod-pinned module versions like CI does.
      GOWORK: "off"
    volumes:
      # Source is a build input only -- mounted read-only so the sandbox
      # cannot mutate the host tree, and out of /workspace so the user's
      # home is the natural cwd. Kegs created at runtime live in the
      # container's writable layer (~/.local/share/tapper/kegs); they
      # survive `restart` but are wiped by `rebuild` / `clean`.
      - ../:/usr/local/src/tapper:cached,ro
      - tapper-go-mod:/home/jlrickert/go
      - tapper-go-build:/home/jlrickert/.cache/go-build
      - tapper-state:/home/jlrickert/.local/state/tapper

volumes:
  tapper-go-mod:
  tapper-go-build:
  tapper-state:
