version: "3"

vars:
  # Local dev runs on Podman v5+ via its native `podman compose` subcommand.
  # Centralized so a future runtime swap is one edit.
  COMPOSE: podman compose
  WORK_COMPOSE: podman compose -f docker-compose.yml -f docker-compose.work.yml

tasks:
  build:
    desc: Build or refresh the sandbox image.
    cmds:
      - "{{.COMPOSE}} build"

  up:
    desc: Start the long-lived sandbox container in the background.
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Stop and remove the container (keeps named volumes).
    cmds:
      - "{{.COMPOSE}} down"

  restart:
    desc: Bounce the sandbox container.
    cmds:
      - "{{.COMPOSE}} restart sandbox"

  rebuild:
    desc: Rebuild the image and recreate the container.
    cmds:
      - "{{.COMPOSE}} up -d --build --force-recreate"

  shell:
    desc: Open an interactive zsh login shell in the sandbox.
    deps: [up]
    interactive: true
    cmds:
      # Direct `podman exec` rather than `podman compose exec`: the latter
      # delegates to the Python podman-compose shim, which SIGKILLs the
      # exec'd process during teardown and surfaces as exit 137 on clean
      # zsh exit. Compose still owns lifecycle (`up`/`down`); native
      # podman owns interactive attach.
      - podman exec -it tapper-sandbox zsh -l

  exec:
    desc: Run an arbitrary command in the sandbox (use `--` to separate).
    deps: [up]
    cmds:
      - podman exec -i tapper-sandbox {{.CLI_ARGS}}

  logs:
    desc: Follow the sandbox container logs.
    cmds:
      - "{{.COMPOSE}} logs -f sandbox"

  status:
    desc: Show the sandbox container state.
    cmds:
      - "{{.COMPOSE}} ps"

  rebuild-tap:
    desc: Rebuild tap inside the sandbox from current source.
    deps: [up]
    cmds:
      - |
        podman exec -i tapper-sandbox bash -lc '
          set -e
          cd /usr/local/src/tapper && go install ./cmd/tap
          tap completion zsh > /usr/local/share/zsh/site-functions/_tap
        '

  refresh-dotfiles:
    desc: |
      Rebuild the sandbox image with the current dotfiles HEAD, then
      recreate the container. Use after pushing to dotfiles when you
      do not want to bump DOTFILES_REV in the Dockerfile by hand.
    vars:
      DOTFILES_HEAD:
        sh: git ls-remote https://github.com/jlrickert/dotfiles.git HEAD | cut -f1
    cmds:
      - "{{.COMPOSE}} build --build-arg DOTFILES_REV={{.DOTFILES_HEAD}} sandbox"
      - "{{.COMPOSE}} up -d --force-recreate sandbox"

  test:
    desc: Run the Go test suite inside the sandbox.
    deps: [up]
    cmds:
      - podman exec -i tapper-sandbox bash -lc 'cd /usr/local/src/tapper && go test ./...'

  clean:
    desc: Remove the container AND named volumes (nukes caches and state).
    cmds:
      - "{{.COMPOSE}} down -v"

  # ---- Work mode (uses local cli-toolkit via go.work) ----

  up-work:
    desc: |
      Start the work-mode sandbox container with the local cli-toolkit
      bind-mounted alongside tapper. Uses go.work so builds and tests
      resolve cli-toolkit to the working tree instead of the pinned
      go.mod version.
    deps: [_ensure-go-work]
    cmds:
      - "{{.WORK_COMPOSE}} up -d sandbox-work"

  shell-work:
    desc: Open an interactive zsh login shell in the work-mode sandbox.
    interactive: true
    deps: [up-work]
    cmds:
      - podman exec -it tapper-sandbox-work zsh -l

  down-work:
    desc: Stop and remove the work-mode container (keeps named volumes).
    cmds:
      - "{{.WORK_COMPOSE}} down sandbox-work"

  exec-work:
    desc: Run an arbitrary command in the work-mode sandbox (use `--`).
    deps: [up-work]
    cmds:
      - podman exec -i tapper-sandbox-work {{.CLI_ARGS}}

  test-work:
    desc: Run the Go test suite inside the work-mode sandbox.
    deps: [up-work]
    cmds:
      - podman exec -i tapper-sandbox-work bash -lc 'cd /usr/local/src/tapper && go test ./...'

  rebuild-tap-work:
    desc: Rebuild tap in work mode (links local cli-toolkit).
    deps: [up-work]
    cmds:
      - |
        podman exec -i tapper-sandbox-work bash -lc '
          set -e
          cd /usr/local/src/tapper && go install ./cmd/tap
          tap completion zsh > /usr/local/share/zsh/site-functions/_tap
        '

  _ensure-go-work:
    desc: Bootstrap ../go.work referencing ../cli-toolkit if missing.
    internal: true
    status:
      - test -f ../go.work
    cmds:
      - |
        cat > ../go.work <<'EOF'
        go 1.26.0

        use (
            .
            ../cli-toolkit
        )
        EOF
