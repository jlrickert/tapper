version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tap
    binary: tap
    main: ./cmd/tap
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]
  - id: keg
    binary: keg
    main: ./cmd/keg
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]

archives:
  - id: tap
    ids: [tap]
    name_template: "tap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]
  - id: keg
    ids: [keg]
    name_template: "keg_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

brews:
  - ids: [tap]
    name: tapper
    repository:
      owner: jlrickert
      name: homebrew-formulae
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jlrickert/tapper"
    description: "CLI toolset for managing KEGs (Knowledge Exchange Graphs)"
    license: "MIT"
    install: |
      bin.install "tap"
      generate_completions_from_executable(bin/"tap", "completion")
    test: |
      system "#{bin}/tap", "--version"
  - ids: [keg]
    name: keg
    repository:
      owner: jlrickert
      name: homebrew-formulae
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jlrickert/tapper"
    description: "Project-focused KEG CLI with pruned command surface"
    license: "MIT"
    install: |
      bin.install "keg"
      generate_completions_from_executable(bin/"keg", "completion")
    test: |
      system "#{bin}/keg", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore: release v"
      - "^Merge"

release:
  footer: |
    ---
    Released with [GoReleaser](https://goreleaser.com).
